name: Build native Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-native
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Configure Maps 3D key
        shell: bash
        run: |
          printf 'MAPS3D_API_KEY=%s\n' "${MAPS3D_API_KEY:-DEFAULT_API_KEY}" > android/secrets.properties
        env:
          MAPS3D_API_KEY: ${{ secrets.MAPS3D_API_KEY }}

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GodsEye-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
