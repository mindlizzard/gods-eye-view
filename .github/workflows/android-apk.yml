name: Build native Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-native
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Configure Maps 3D key
        shell: bash
        run: |
          printf 'MAPS3D_API_KEY=%s\n' "${MAPS3D_API_KEY:-DEFAULT_API_KEY}" > android/secrets.properties
        env:
          MAPS3D_API_KEY: ${{ secrets.MAPS3D_API_KEY }}

      - name: Restore stable Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_B64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 is missing. Run scripts/setup-android-stable-signing.sh once."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > android/godseye-signing.jks

      - name: Build debug APK
        working-directory: android
        env:
          GODSEYE_KEYSTORE_PATH: godseye-signing.jks
          GODSEYE_KEYSTORE_PASSWORD: ${{ secrets.GODSEYE_KEYSTORE_PASSWORD }}
          GODSEYE_KEY_ALIAS: ${{ secrets.GODSEYE_KEY_ALIAS }}
          GODSEYE_KEY_PASSWORD: ${{ secrets.GODSEYE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GodsEye-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
